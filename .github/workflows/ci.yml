name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, to pick up new ZAP rules

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=zapgate --cov=notes_app --cov-report=term-missing --cov-fail-under=85

  dast:
    name: ZAP scans, hardened app (gate must pass)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: scripts/start-app.sh
      - run: scripts/zap-scan.sh
      - name: Gate
        run: uv run zapgate reports/full.json reports/api.json --policy zap/policy.toml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-reports-hardened
          path: |
            reports/
            app.log

  dast-negative:
    name: ZAP scans, insecure mode (gate must fail)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: scripts/start-app.sh insecure
      - run: scripts/zap-scan.sh
      - name: Gate must reject the insecure build
        run: |
          set +e
          uv run zapgate reports/full.json reports/api.json --policy zap/policy.toml
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::expected zapgate to exit 1 for the insecure app, got $code"
            exit 1
          fi
      - name: The scan found the planted problems
        run: uv run python scripts/expect_alerts.py reports/full.json reports/api.json --require 10038 10020 10021 40012
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-reports-insecure
          path: |
            reports/
            app.log
