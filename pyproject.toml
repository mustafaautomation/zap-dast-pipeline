[project]
name = "zap-dast-pipeline"
version = "0.1.0"
description = "OWASP ZAP scans in CI with a policy gate (severity threshold, expiring allowlist) for a small FastAPI app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.162", "uvicorn>=0.54"]

[project.scripts]
zapgate = "zapgate.cli:main"
notes-app = "notes_app.main:run"

[dependency-groups]
dev = ["httpx2>=2.16", "pytest>=9.1", "pytest-cov>=7.1", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_app", "src/zapgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
