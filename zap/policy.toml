# Gate policy for the ZAP scans in CI.
# Alerts at or above fail_on (with confidence >= min_confidence) fail the build unless an
# [[allow]] entry covers them. Every entry needs a reason and an expiry date; expired
# entries stop applying, so accepted risks get reviewed again.

[gate]
fail_on = "low"
min_confidence = 1   # 0 = false positive

# Accepted findings. Each one is specific to how CI runs the scan, not to the app's code.

[[allow]]
plugin_id = "10106"
uri_regex = "^http://localhost:8000/"
reason = "CI scans the app over plain HTTP on localhost; there is no TLS listener to find. A real deployment would terminate TLS at a proxy and should be scanned there."
expires = 2027-04-30

[[allow]]
plugin_id = "100001"
uri_regex = "^http://localhost:8000/?$"
reason = "The API scan probes the site root, which is the HTML page rather than JSON; the full scan covers that page with the page rules."
expires = 2027-04-30
